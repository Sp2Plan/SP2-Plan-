<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">

 <title>SP2 — Plan lekcji</title>

  <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f4f5fb;
    --card: #ffffff;
    --lesson: #ffffff;
    --text: #181824;
    --secondary: #77778b;
    --border: rgba(0,0,0,.07);
    --accent: #6c5ce7;
    --accent2: #8b7cf6;
    --shadow: 0 12px 35px rgba(30,25,70,.09);
}

body.dark {
    --bg: #101018;
    --card: #1c1c28;
    --lesson: #232330;
    --text: #f5f5fa;
    --secondary: #aaaabd;
    --border: rgba(255,255,255,.08);
    --shadow: 0 12px 35px rgba(0,0,0,.3);
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 0%, rgba(108,92,231,.15), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(139,124,246,.12), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    transition: background .3s ease, color .3s ease;
}

button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.container {
    width: min(100% - 20px, 1050px);
    margin: auto;
    padding: 18px 0 50px;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    color: white;
    font-weight: 900;
    font-size: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 22px rgba(108,92,231,.3);
}

.brand h1 {
    font-size: 22px;
    font-weight: 900;
}

.brand p {
    color: var(--secondary);
    font-size: 12px;
    margin-top: 2px;
}

.actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.language {
    display: flex;
    padding: 4px;
    border-radius: 13px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
}

.language button {
    padding: 7px 9px;
    border-radius: 9px;
    color: var(--secondary);
    background: transparent;
    font-size: 12px;
    font-weight: 800;
}

.language button.active {
    background: var(--accent);
    color: white;
}

.icon-btn {
    width: 41px;
    height: 41px;
    border-radius: 13px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    box-shadow: var(--shadow);
    font-size: 18px;
    transition: transform .2s ease;
}

.icon-btn:hover {
    transform: translateY(-2px);
}

/* CLASS PANEL */

.class-panel {
    position: relative;
    overflow: hidden;
    padding: 23px;
    border-radius: 25px;
    color: white;
    background: linear-gradient(135deg, var(--accent), #8172f1);
    box-shadow: 0 16px 35px rgba(108,92,231,.25);
    margin-bottom: 22px;
}

.class-panel::after {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    right: -55px;
    top: -80px;
}

.class-title {
    position: relative;
    z-index: 2;
}

.class-title span {
    font-size: 12px;
    opacity: .8;
}

.class-title h2 {
    font-size: 30px;
    font-weight: 900;
    margin-top: 2px;
}

.class-tabs {
    display: flex;
    gap: 7px;
    margin-top: 18px;
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
}

.class-tab {
    padding: 10px 17px;
    border-radius: 12px;
    color: white;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.15);
    font-weight: 800;
    transition: .25s ease;
}

.class-tab:hover {
    transform: translateY(-2px);
}

.class-tab.active {
    color: var(--accent);
    background: white;
    transform: translateY(-2px);
}

/* WEEK TITLE */

.week-title {
    margin: 8px 3px 17px;
}

.week-title h2 {
    font-size: 24px;
    font-weight: 900;
}

.week-title p {
    color: var(--secondary);
    font-size: 13px;
    margin-top: 5px;
}

/* SCHEDULE */

#schedule {
    display: grid;
    gap: 17px;
}

.day {
    padding: 17px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    animation: appear .4s ease both;
}

.day:nth-child(2) {
    animation-delay: .05s;
}

.day:nth-child(3) {
    animation-delay: .10s;
}

.day:nth-child(4) {
    animation-delay: .15s;
}

.day:nth-child(5) {
    animation-delay: .20s;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.day-name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 900;
}

.day-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--day-color);
    box-shadow: 0 0 0 5px rgba(108,92,231,.08);
}

.lesson-count {
    color: var(--secondary);
    font-size: 11px;
    font-weight: 700;
}

.lessons {
    display: grid;
    gap: 8px;
}

.lesson {
    min-height: 54px;
    display: grid;
    grid-template-columns: 41px 1fr;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 7px;
    border-radius: 15px;
    background: var(--lesson);
    border: 1px solid var(--border);
    transition: transform .2s ease, box-shadow .2s ease;
}

.lesson:hover {
    transform: translateX(3px);
    box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.lesson-number {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    color: var(--accent);
    background: rgba(108,92,231,.1);
    font-weight: 900;
}

.lesson-name {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.25;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 55px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 23px;
    box-shadow: var(--shadow);
    animation: appear .4s ease;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty h2 {
    font-size: 21px;
    margin-bottom: 8px;
}

.empty p {
    color: var(--secondary);
    font-size: 14px;
}

/* CONTACT */

.contact {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 23px;
    padding: 25px;
    box-shadow: var(--shadow);
    animation: appear .4s ease;
}

.contact-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.contact h2 {
    font-size: 23px;
    font-weight: 900;
    margin-bottom: 9px;
}

.contact-description {
    color: var(--secondary);
    line-height: 1.55;
    font-size: 14px;
    margin-bottom: 20px;
}

.email-box {
    padding: 15px;
    border-radius: 15px;
    background: rgba(108,92,231,.08);
    border: 1px solid rgba(108,92,231,.15);
    margin-bottom: 16px;
}

.email-box strong {
    display: block;
    color: var(--accent);
    font-size: 13px;
    margin-bottom: 5px;
}

.email-address {
    font-size: 15px;
    font-weight: 800;
    word-break: break-word;
}

.form-rule {
    padding: 15px;
    border-radius: 15px;
    background: rgba(108,92,231,.06);
    margin-bottom: 18px;
}

.form-rule strong {
    display: block;
    margin-bottom: 8px;
}

.form-rule code {
    display: inline-block;
    padding: 9px 11px;
    border-radius: 9px;
    background: var(--lesson);
    color: var(--accent);
    font-weight: 800;
    font-size: 13px;
}

.contact-button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    color: white;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    font-size: 14px;
    font-weight: 850;
    text-decoration: none;
    box-shadow: 0 8px 20px rgba(108,92,231,.22);
    transition: .2s ease;
}

.contact-button:hover {
    transform: translateY(-2px);
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        width: min(100% - 16px, 550px);
        padding-top: 12px;
    }

    header {
        align-items: flex-start;
    }

    .logo {
        width: 44px;
        height: 44px;
        border-radius: 13px;
    }

    .brand h1 {
        font-size: 19px;
    }

    .brand p {
        font-size: 11px;
    }

    .actions {
        gap: 4px;
    }

    .icon-btn {
        width: 38px;
        height: 38px;
    }

    .language button {
        padding: 7px 7px;
    }

    .class-panel {
        padding: 20px;
        border-radius: 22px;
    }

    .class-title h2 {
        font-size: 27px;
    }

    .class-tab {
        padding: 9px 14px;
    }

    .week-title h2 {
        font-size: 22px;
    }

    .day {
        padding: 13px;
        border-radius: 19px;
    }

    .lesson {
        grid-template-columns: 38px 1fr;
        min-height: 51px;
    }

    .lesson-number {
        width: 36px;
        height: 36px;
        border-radius: 10px;
    }

    .lesson-name {
        font-size: 13px;
    }

    .contact {
        padding: 21px;
    }
}
</style>

  </head>
<div class="container">

  <header>
<div class="brand">
    <div class="logo">SP2</div>

    <div>
        <h1>SP2</h1>
        <p id="schoolSubtitle">Plan lekcji</p>
    </div>
</div>

<div class="actions">

    <div class="language">
        <button id="plBtn" class="active">🇵🇱 PL</button>
        <button id="uaBtn">🇺🇦 UA</button>

<section class="class-panel">

 <div class="class-title">

</div>

    <button class="class-tab active" data-class="7A">
        7A

    <button class="class-tab" data-class="5B">

    <button class="class-tab" data-class="contact">

</div>

  <h2 id="weekTitle">
    Rozkład na tydzień
</h2>

<p id="weekSubtitle">
    Lekcje dla klasy 7A
</p>
  
</section>

  <main id="schedule"></main>

  </div>

<script>

/* =========================
   TRANSLATIONS
========================= */

const translations = {

    pl: {

        subtitle: "Plan lekcji",

        selected: "Wybrana klasa",

        week: "Rozkład na tydzień",

        lessonsFor: "Lekcje dla klasy",

        empty: "Rozkład dla 5B nie został jeszcze dodany",

            "Немецкий язык": "Język niemiecki",

        }
    },


    ua: {

        selected: "Обраний клас",

        lessonsFor: "Уроки для класу",

        lessons: "уроків",

        empty: "Розклад для 5B поки не додано",

        contactTab: "Немає твого розкладу?",

        contactTitle: "Немає твого розкладу?",

        contactDescription:
            "Якщо тут немає розкладу твого класу, напиши нам. Ми додамо твій розклад на сайт.",

        emailLabel: "Напиши нам:",

        formTitle: "Важливо — напиши повідомлення за цим форматом:",

        formText:
            "У темі листа напиши PLAN + свій клас, а в повідомленні обов’язково вкажи своє ім’я та надішли свій розклад.",

        formExample:
            "PLAN 7A",

        nameInfo:
            "Не забудь обов’язково написати своє ім’я.",

        send:
            "✉️ Написати повідомлення",

        days: [
            "Понеділок",
            "Вівторок",
            "Середа",
            "Четвер",
            "П’ятниця"
        ],

        subjects: {

            "Английский язык": "Англійська мова",

            "Польский язык": "Польська мова",

            "Немецкий язык": "Німецька мова",

            "Математика": "Математика",

            "История": "Історія",

            "Физика": "Фізика",

            "Химия": "Хімія",

            "Биология": "Біологія",

            "География": "Географія",

            "Информатика": "Інформатика",

            "Музыка": "Музика",

            "Физкультура": "Фізична культура",

            "Пластика": "Пластика",

            "E_ZDROWOTNA": "E_ZDROWOTNA",

            "Doradztwo zawodowe": "Профорієнтація",

            "Zajęcia z wychowawcą (училка)":
                "Заняття з класним керівником"
        }
    }

};


/* =========================
   SCHEDULE
========================= */

const scheduleData = {

    "7A": [

        [
            "Английский язык",
            "Английский язык",
            "Музыка",
            "Биология",
            "E_ZDROWOTNA",
            "Польский язык",
            "Doradztwo zawodowe"
        ],

        [
            "Английский язык",
            "Английский язык",
            "Польский язык",
            "Физика",
            "Химия",
            "Пластика",
            "Физкультура",
            "Физкультура"
        ],

        [
            "Химия",
            "Немецкий язык",
            "Математика",
            "История",
            "Zajęcia z wychowawcą (училка)",
            "Математика",
            "Английский язык"
        ],

        [
            "Английский язык",
            "История",
            "Польский язык",
            "Польский язык",
            "Математика",
            "Математика",
            "Физика"
        ],

        [
            "Немецкий язык",
            "Информатика",
            "Биология",
            "География",
            "Польский язык",
            "Математика",
            "Физкультура",
            "Физкультура"
        ]

    ]

};


/* =========================
   VARIABLES
========================= */

let currentLanguage = "pl";

let currentClass = "7A";

const schedule = document.getElementById("schedule");

const themeBtn = document.getElementById("themeBtn");


const dayColors = [
    "#6c5ce7",
    "#00b894",
    "#0984e3",
    "#e17055",
    "#fdcb6e"
];


/* =========================
   RENDER
========================= */

function render() {

    const t = translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage === "pl" ? "pl" : "uk";


    document.getElementById("schoolSubtitle").textContent =
        t.subtitle;


    document.getElementById("selectedText").textContent =
        t.selected;


    document.getElementById("weekTitle").textContent =
        t.week;


    document.getElementById("contactTab").textContent =
        t.contactTab;


    document.getElementById("selectedClass").textContent =
        currentClass === "contact" ? "📩" : currentClass;


    if (currentClass === "contact") {

        document.getElementById("weekTitle").textContent =
            t.contactTitle;

        document.getElementById("weekSubtitle").textContent =
            t.emailLabel;

        schedule.innerHTML = `

            <section class="contact">

                <div class="contact-icon">
                    📚
                </div>

                <h2>
                    ${t.contactTitle}
                </h2>

                <p class="contact-description">
                    ${t.contactDescription}
                </p>


                <div class="email-box">

                    <strong>
                        ${t.emailLabel}
                    </strong>

                    <div class="email-address">
                        Boleslawiec0@gmail.com
                    </div>

                </div>


                <div class="form-rule">

                    <strong>
                        ${t.formTitle}
                    </strong>

                    <p class="contact-description">
                        ${t.formText}
                    </p>

                    <code>
                        ${t.formExample}
                    </code>

                    <p style="margin-top:10px;font-size:13px;color:var(--secondary);">
                        ${t.nameInfo}
                    </p>

                </div>


                <a
                    class="contact-button"
                    href="mailto:Boleslawiec0@gmail.com?subject=PLAN%207A"
                >
                    ${t.send}
                </a>

            </section>

        `;

        updateTabs();

        return;
    }


    document.getElementById("weekSubtitle").textContent =
        `${t.lessonsFor} ${currentClass}`;


    if (currentClass === "5B") {

        schedule.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📚
                </div>

                <h2>
                    ${t.empty}
                </h2>

                <p>
                    5B
                </p>

            </div>

        `;

        updateTabs();

        return;
    }


    schedule.innerHTML = "";


    scheduleData["7A"].forEach((lessons, dayIndex) => {

        const day = document.createElement("section");

        day.className = "day";

        day.style.setProperty(
            "--day-color",
            dayColors[dayIndex]
        );


        let lessonHTML = "";


        lessons.forEach((subject, index) => {

            const translatedSubject =
                t.subjects[subject] || subject;


            lessonHTML += `

                <div class="lesson">

                    <div class="lesson-number">
                        ${index + 1}
                    </div>

                    <div class="lesson-name">
                        ${translatedSubject}
                    </div>

                </div>

            `;

        });


        day.innerHTML = `

            <div class="day-header">

                <div class="day-name">

                    <span class="day-dot"></span>

                    ${t.days[dayIndex]}

                </div>

                <div class="lesson-count">

                    ${lessons.length}
                    ${t.lessons}

                </div>

            </div>


            <div class="lessons">

                ${lessonHTML}

            </div>

        `;


        schedule.appendChild(day);

    });


    updateTabs();

}


/* =========================
   TABS
========================= */

function updateTabs() {

    document.querySelectorAll(".class-tab").forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.class === currentClass
        );

    });

}


document.querySelectorAll(".class-tab").forEach(button => {

    button.addEventListener("click", () => {

        currentClass = button.dataset.class;

        render();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });

});


/* =========================
   LANGUAGE
========================= */

document.getElementById("plBtn").addEventListener("click", () => {

    currentLanguage = "pl";

    document.getElementById("plBtn").classList.add("active");

    document.getElementById("uaBtn").classList.remove("active");

    render();

});


document.getElementById("uaBtn").addEventListener("click", () => {

    currentLanguage = "ua";

    document.getElementById("uaBtn").classList.add("active");

    document.getElementById("plBtn").classList.remove("active");

    render();

});


/* =========================
   DARK MODE
========================= */

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");


    themeBtn.textContent =
        dark ? "☀️" : "🌙";


    localStorage.setItem(
        "sp2-theme",
        dark ? "dark" : "light"
    );

});


/* =========================
   LOAD SAVED THEME
========================= */

if (localStorage.getItem("sp2-theme") === "dark") {

    document.body.classList.add("dark");

    themeBtn.textContent = "☀️";

}


/* =========================
   START
========================= */

render();

</script>

<style>
  #sp2-account {
    margin-top: 20px;
  }

  .sp2-account-box {
    max-width: 420px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 20px;
    background: var(--card-bg, #fff);
    box-sizing: border-box;
  }

  .sp2-account-input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 7px 0;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
  }

  .sp2-account-button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: #7c3aed;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  .sp2-account-error {
    color: #e53935;
    margin-top: 12px;
    display: none;
  }

  .sp2-account-success {
    padding: 15px;
    border-radius: 12px;
    background: rgba(50, 180, 80, .12);
    margin-top: 15px;
  }

  .sp2-logout {
    background: #555;
  }
</style>


<script>

  /* =================================================
     1. АККАУНТЫ УЧЕНИКОВ

     ДОБАВЛЯЙ НОВЫЕ АККАУНТЫ СЮДА
     ================================================= */

  const accounts = [

    {
      nickname: "Alex_7A",
      password: "12345",
      class: "7A"
    },

    {
      nickname: "Max_5B",
      password: "67890",
      class: "5B"
    }

  ];


  /* =================================================
     2. СОХРАНЯЕМ ТЕКУЩЕГО ПОЛЬЗОВАТЕЛЯ
     ================================================= */

  let currentStudent = null;


  /* =================================================
     3. СОЗДАЁМ КНОПКУ ВХОДА
     ================================================= */

  function sp2CreateLogin() {

    const container = document.createElement("div");

    container.id = "sp2-account";

    container.innerHTML = `

      <div class="sp2-account-box">

        <h2>👤 Вход</h2>

        <p>
          Войдите в свой аккаунт, чтобы открыть
          расписание своего класса.
        </p>

        <input
          id="sp2-login-nickname"
          class="sp2-account-input"
          type="text"
          placeholder="Никнейм"
          autocomplete="off"
        >

        <input
          id="sp2-login-password"
          class="sp2-account-input"
          type="password"
          placeholder="Пароль"
        >

        <button
          class="sp2-account-button"
          onclick="sp2Login()">

          Войти

        </button>

        <div
          id="sp2-login-error"
          class="sp2-account-error">

          ❌ Неверный никнейм или пароль.

        </div>

      </div>

    `;

    document.body.appendChild(container);

  }


  /* =================================================
     4. ВХОД
     ================================================= */

  function sp2Login() {

    const nickname =
      document
        .getElementById("sp2-login-nickname")
        .value
        .trim();

    const password =
      document
        .getElementById("sp2-login-password")
        .value;

    const error =
      document.getElementById("sp2-login-error");


    const account = accounts.find(function(user) {

      return (
        user.nickname === nickname &&
        user.password === password
      );

    });


    if (!account) {

      error.style.display = "block";

      return;

    }


    error.style.display = "none";

    currentStudent = account;

    showStudentAccount();

  }


  /* =================================================
     5. ПОКАЗЫВАЕМ АККАУНТ
     ================================================= */

  function showStudentAccount() {

    const container =
      document.getElementById("sp2-account");


    if (!currentStudent) return;


    let scheduleMessage = "";


    if (currentStudent.class === "7A") {

      scheduleMessage = `
        <div class="sp2-account-success">
          📚 Расписание класса <b>7A</b> доступно.
          <br><br>
          Используй своё обычное расписание
          7A на сайте.
        </div>
      `;

    }


    else if (currentStudent.class === "5B") {

      scheduleMessage = `
        <div class="sp2-account-success">
          📚 Класс <b>5B</b>
          <br><br>
          Расписание пока не добавлено.
        </div>
      `;

    }


    else {

      scheduleMessage = `
        <div class="sp2-account-success">
          📚 Расписание для класса
          <b>${currentStudent.class}</b>
          пока не добавлено.
        </div>
      `;

    }


    container.innerHTML = `

      <div class="sp2-account-box">

        <h2>
          👋 Привет, ${currentStudent.nickname}!
        </h2>

        <p>
          🏫 Твой класс:
          <b>${currentStudent.class}</b>
        </p>

        ${scheduleMessage}

        <button
          class="sp2-account-button sp2-logout"
          onclick="sp2Logout()">

          🚪 Выйти

        </button>

      </div>

    `;

  }


  /* =================================================
     6. ВЫХОД
     ================================================= */

  function sp2Logout() {

    currentStudent = null;

    const container =
      document.getElementById("sp2-account");

    container.remove();

    sp2CreateLogin();

  }


  /* =================================================
     7. ЗАПУСК
     ================================================= */

  document.addEventListener("DOMContentLoaded", function() {

    sp2CreateLogin();

  });

</script>

<!-- ================= END SP2 ACCOUNTS ================= -->
  
</body>
  
</html>
