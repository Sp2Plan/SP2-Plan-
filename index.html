<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SP2 7A</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
      transition: 0.3s;
    }

    body.dark {
      background: #111114;
      color: #fff;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 20px 0 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: #7c3aed;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 15px;
      border-radius: 12px;
      padding: 10px 14px;
      background: #e9e9ed;
      color: #111;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    body.dark button {
      background: #242428;
      color: #fff;
    }

    .class-panel {
      background: white;
      padding: 12px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    body.dark .class-panel {
      background: #1b1b1f;
    }

    .class-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .class-tab.active {
      background: #7c3aed;
      color: white;
    }

    .week-title {
      margin: 20px 0;
    }

    .week-title h1 {
      font-size: 26px;
    }

    .schedule {
      display: grid;
      gap: 15px;
    }

    .day {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
    }

    body.dark .day {
      background: #1b1b1f;
    }

    .day h2 {
      margin-bottom: 14px;
      font-size: 20px;
    }

    .lesson {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background: #f3f3f5;
      margin-top: 8px;
    }

    body.dark .lesson {
      background: #252529;
    }

    .number {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #7c3aed;
      color: white;
      border-radius: 9px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 20px;
    }

    body.dark .empty {
      background: #1b1b1f;
    }

    @media (max-width: 600px) {
      .container {
        width: 92%;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .logo {
        font-size: 25px;
      }

      .class-tabs button {
        flex: 1;
      }

      .day {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">
        <span>SP2</span> 7A
      </div>

      <div class="actions">
        <button id="plBtn">🇵🇱 PL</button>
        <button id="uaBtn">🇺🇦 UA</button>
        <button id="themeBtn">🌙</button>
      </div>
    </header>

    <div class="class-panel">
      <div class="class-tabs">
        <button class="class-tab active" data-class="7A">7A</button>
        <button class="class-tab" data-class="5B">5B</button>
        <button class="class-tab" data-class="contact">📩 Kontakt</button>
      </div>
    </div>

    <section class="week-title">
      <h1 id="pageTitle">Plan lekcji</h1>
    </section>

    <main id="schedule" class="schedule"></main>

  </div>

</body>
 <script>
const scheduleData = {

  "7A": {
    "Понедельник": [
      "Angielski",
      "Angielski",
      "Muzyka",
      "Biologia",
      "E_ZDROWOTNA",
      "Język polski",
      "Doradztwo zawodowe"
    ],

    "Wtorek": [
      "Angielski",
      "Angielski",
      "Język polski",
      "Fizyka",
      "Chemia",
      "Plastyka",
      "Wychowanie fizyczne",
      "Wychowanie fizyczne"
    ],

    "Środa": [
      "Chemia",
      "Język niemiecki",
      "Matematyka",
      "Historia",
      "Zajęcia z wychowawcą",
      "Matematyka",
      "Angielski"
    ],

    "Czwartek": [
      "Angielski",
      "Historia",
      "Język polski",
      "Język polski",
      "Matematyka",
      "Matematyka",
      "Fizyka"
    ],

    "Piątek": [
      "Język niemiecki",
      "Informatyka",
      "Biologia",
      "Geografia",
      "Język polski",
      "Matematyka",
      "Wychowanie fizyczne",
      "Wychowanie fizyczne"
    ]
  },

  "5B": {}

};


let currentClass = "7A";


function renderSchedule() {

  const schedule =
    document.getElementById("schedule");

  schedule.innerHTML = "";


  /* Контакт */

  if (currentClass === "contact") {

    schedule.innerHTML = `
      <div class="empty">
        <h2>📩 Nie ma twojego planu?</h2>
        <br>
        <p>
          Napisz do nas, a dodamy brakujący plan lekcji.
        </p>

        <br>

        <p>
          📧 Boleslawiec0@gmail.com
        </p>

        <br>

        <p>
          Temat: PLAN 7A
        </p>
      </div>
    `;

    return;
  }


  /* Пустой класс */

  if (
    !scheduleData[currentClass] ||
    Object.keys(scheduleData[currentClass]).length === 0
  ) {

    schedule.innerHTML = `
      <div class="empty">
        <h2>📚 ${currentClass}</h2>
        <br>
        <p>
          Расписание пока не добавлено.
        </p>
      </div>
    `;

    return;
  }


  /* Расписание */

  for (
    const [day, lessons]
    of Object.entries(scheduleData[currentClass])
  ) {

    const dayElement =
      document.createElement("div");

    dayElement.className = "day";


    let html = `
      <h2>${day}</h2>
    `;


    lessons.forEach((lesson, index) => {

      html += `
        <div class="lesson">

          <div class="number">
            ${index + 1}
          </div>

          <div>
            ${lesson}
          </div>

        </div>
      `;

    });


    dayElement.innerHTML = html;

    schedule.appendChild(dayElement);

  }

}


/* Переключение классов */

document
  .querySelectorAll(".class-tab")
  .forEach(button => {

    button.addEventListener("click", () => {

      currentClass =
        button.dataset.class;

      document
        .querySelectorAll(".class-tab")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      renderSchedule();

    });

  });


renderSchedule();
</script>
 <script>
const translations = {

  pl: {
    title: "Plan lekcji",

    contactTitle: "Nie ma twojego planu?",
    contactText: "Napisz do nas, a dodamy brakujący plan lekcji.",
    contactSubject: "Temat: PLAN 7A",

    emptySchedule: "Расписание пока не добавлено."
  },

  ua: {
    title: "Розклад уроків",

    contactTitle: "Немає твого розкладу?",
    contactText: "Напиши нам, і ми додамо відсутній розклад.",
    contactSubject: "Тема: PLAN 7A",

    emptySchedule: "Розклад поки не додано."
  }

};

let currentLanguage = "pl";


const ukrainianSubjects = {
  "Angielski": "Англійська",
  "Muzyka": "Музика",
  "Biologia": "Біологія",
  "E_ZDROWOTNA": "E_ZDROWOTNA",
  "Język polski": "Польська мова",
  "Doradztwo zawodowe": "Профорієнтація",

  "Fizyka": "Фізика",
  "Chemia": "Хімія",
  "Plastyka": "Образотворче мистецтво",
  "Wychowanie fizyczne": "Фізкультура",

  "Język niemiecki": "Німецька мова",
  "Matematyka": "Математика",
  "Historia": "Історія",
  "Zajęcia z wychowawcą": "Година класного керівника",
  "Informatyka": "Інформатика",
  "Geografia": "Географія"
};


const ukrainianDays = {
  "Poniedziałek": "Понеділок",
  "Wtorek": "Вівторок",
  "Środa": "Середа",
  "Czwartek": "Четвер",
  "Piątek": "П’ятниця"
};


function translateSubject(subject) {

  if (currentLanguage === "ua") {
    return ukrainianSubjects[subject] || subject;
  }

  return subject;
}


function translateDay(day) {

  if (currentLanguage === "ua") {
    return ukrainianDays[day] || day;
  }

  return day;
}


/*
Перерисовываем расписание
*/

const oldRenderSchedule = renderSchedule;

renderSchedule = function() {

  const schedule =
    document.getElementById("schedule");

  schedule.innerHTML = "";


  if (currentClass === "contact") {

    schedule.innerHTML = `
      <div class="empty">

        <h2>
          📩 ${translations[currentLanguage].contactTitle}
        </h2>

        <br>

        <p>
          ${translations[currentLanguage].contactText}
        </p>

        <br>

        <p>
          📧 Boleslawiec0@gmail.com
        </p>

        <br>

        <p>
          ${translations[currentLanguage].contactSubject}
        </p>

      </div>
    `;

    return;
  }


  if (
    !scheduleData[currentClass] ||
    Object.keys(scheduleData[currentClass]).length === 0
  ) {

    schedule.innerHTML = `
      <div class="empty">

        <h2>📚 ${currentClass}</h2>

        <br>

        <p>
          ${translations[currentLanguage].emptySchedule}
        </p>

      </div>
    `;

    return;
  }


  for (
    const [day, lessons]
    of Object.entries(scheduleData[currentClass])
  ) {

    const dayElement =
      document.createElement("div");

    dayElement.className = "day";


    let html = `
      <h2>${translateDay(day)}</h2>
    `;


    lessons.forEach((lesson, index) => {

      html += `
        <div class="lesson">

          <div class="number">
            ${index + 1}
          </div>

          <div>
            ${translateSubject(lesson)}
          </div>

        </div>
      `;

    });


    dayElement.innerHTML = html;

    schedule.appendChild(dayElement);

  }

};


function updateLanguage() {

  document.getElementById("pageTitle").textContent =
    translations[currentLanguage].title;

  renderSchedule();

}


document.getElementById("plBtn").onclick = function() {

  currentLanguage = "pl";

  updateLanguage();

};


document.getElementById("uaBtn").onclick = function() {

  currentLanguage = "ua";

  updateLanguage();

};
</script>
 <script>
const themeButton =
  document.getElementById("themeBtn");


function updateThemeIcon() {

  if (document.body.classList.contains("dark")) {

    themeButton.textContent = "☀️";

  } else {

    themeButton.textContent = "🌙";

  }

}


const savedTheme =
  localStorage.getItem("sp2-theme");


if (savedTheme === "dark") {

  document.body.classList.add("dark");

}


updateThemeIcon();


themeButton.addEventListener("click", () => {

  document.body.classList.toggle("dark");


  if (
    document.body.classList.contains("dark")
  ) {

    localStorage.setItem(
      "sp2-theme",
      "dark"
    );

  } else {

    localStorage.setItem(
      "sp2-theme",
      "light"
    );

  }


  updateThemeIcon();

});
</script>

<div id="sp2Login">

  <div class="login-box">

    <div class="login-logo">
      SP2
    </div>

    <h2>👋 Witaj!</h2>

    <p class="login-description">
      Zaloguj się, aby zobaczyć plan lekcji swojego klasy.
    </p>

    <input
      id="loginNickname"
      class="login-input"
      type="text"
      placeholder="Nick"
      autocomplete="off"
    >

    <input
      id="loginPassword"
      class="login-input"
      type="password"
      placeholder="Hasło"
    >

    <button
      class="login-button"
      id="loginButton">

      Zaloguj się

    </button>

    <div
      id="loginError"
      class="login-error">

      ❌ Nieprawidłowy nick lub hasło.

    </div>

  </div>

</div>


<script>

/*
==================================================
АККАУНТЫ УЧЕНИКОВ
==================================================

Чтобы добавить ученика, добавь ещё один объект.

ВАЖНО:
Это тестовая система.
Пароли находятся в коде сайта.
Не используй настоящие пароли.
*/


const students = [

  {
    nickname: "WEX1DE",
    password: "artemfy",
    class: "7A"
  },

  {
    nickname: "VladКрутой",
    password: "676789",
    class: "5B"
  }

];


/*
==================================================
ТЕКУЩИЙ УЧЕНИК
==================================================
*/

let currentStudent = null;


/*
==================================================
ВХОД
==================================================
*/

function login() {

  const nickname =
    document
      .getElementById("loginNickname")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  const student =
    students.find(user =>

      user.nickname === nickname &&
      user.password === password

    );


  if (!student) {

    document
      .getElementById("loginError")
      .style.display = "block";

    return;
  }


  /*
  Успешный вход
  */

  currentStudent = student;


  /*
  Устанавливаем класс ученика
  */

  currentClass = student.class;


  /*
  Скрываем окно
  */

  document
    .getElementById("sp2Login")
    .classList.add("hidden");


  /*
  Обновляем вкладки
  */

  updateStudentTabs();


  /*
  Показываем расписание
  */

  renderSchedule();

}


/*
==================================================
ENTER = ВХОД
==================================================
*/

document
  .getElementById("loginPassword")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        login();

      }

    }
  );


document
  .getElementById("loginNickname")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        login();

      }

    }
  );


document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


/*
==================================================
СКРЫВАЕМ ЧУЖОЙ КЛАСС
==================================================
*/

function updateStudentTabs() {

  document
    .querySelectorAll(".class-tab")
    .forEach(button => {

      const className =
        button.dataset.class;


      /*
      Kontakt оставляем
      */

      if (className === "contact") {

        button.style.display = "";

        return;

      }


      /*
      Показываем только свой класс
      */

      if (
        currentStudent &&
        className === currentStudent.class
      ) {

        button.style.display = "";

      } else {

        button.style.display = "none";

      }

    });

}


/*
==================================================
ЗАЩИТА ОТ ПЕРЕКЛЮЧЕНИЯ
==================================================
*/

document
  .querySelectorAll(".class-tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(event) {

        if (!currentStudent) {

          event.preventDefault();

          return;

        }


        const selectedClass =
          button.dataset.class;


        if (
          selectedClass !== "contact" &&
          selectedClass !== currentStudent.class
        ) {

          event.preventDefault();

          return;

        }

      }
    );

  });


/*
==================================================
ПРИ ЗАПУСКЕ САЙТА
==================================================
*/

document
  .querySelectorAll(".class-tab")
  .forEach(button => {

    if (button.dataset.class !== "contact") {

      button.style.display = "none";

    }

  });

</script>
